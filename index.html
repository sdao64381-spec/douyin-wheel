<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>心诚则灵</title>

<style>
body{
margin:0;
background:#002b16;
color:#00ff88;
font-family:sans-serif;
text-align:center;
}

h1{
margin-top:40px;
font-size:42px;
}

#wheel{
width:420px;
height:420px;
margin:40px auto;
border-radius:50%;
border:8px solid #00ff88;
background:conic-gradient(
#00ff88 0deg 45deg,
#003b20 45deg 90deg,
#00ff88 90deg 135deg,
#003b20 135deg 180deg,
#00ff88 180deg 225deg,
#003b20 225deg 270deg,
#00ff88 270deg 315deg,
#003b20 315deg 360deg
);
position:relative;
transition:transform 5s cubic-bezier(.2,.8,.2,1);
}

.num{
position:absolute;
left:190px;
top:185px;
font-size:40px;
font-weight:bold;
color:white;
transform-origin:20px 25px;
}

button{
background:#00ff88;
border:0;
padding:20px 50px;
font-size:25px;
border-radius:40px;
cursor:pointer;
}

#result{
font-size:35px;
margin-top:30px;
}
</style>
</head>


<body>

<h1>🟢 心诚则灵 🟢</h1>

<div id="wheel">
<div class="num" style="transform:rotate(0deg) translateY(-160px)">1</div>
<div class="num" style="transform:rotate(45deg) translateY(-160px)">2</div>
<div class="num" style="transform:rotate(90deg) translateY(-160px)">3</div>
<div class="num" style="transform:rotate(135deg) translateY(-160px)">4</div>
<div class="num" style="transform:rotate(180deg) translateY(-160px)">5</div>
<div class="num" style="transform:rotate(225deg) translateY(-160px)">6</div>
<div class="num" style="transform:rotate(270deg) translateY(-160px)">7</div>
<div class="num" style="transform:rotate(315deg) translateY(-160px)">8</div>
</div>

<button onclick="spin()">开始转盘</button>

<div id="result"></div>


<script>

let wheel=document.getElementById("wheel");

function spin(){

let num=Math.floor(Math.random()*8)+1;

let deg=1800+(num*45);

wheel.style.transform="rotate("+deg+"deg)";

setTimeout(()=>{

document.getElementById("result").innerHTML=
"✨ 心诚则灵：数字 "+num+" ✨";

},5000);

}

</script>


</body>
</html>
