<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>玄学数字转盘</title>

<style>
body{
margin:0;
background:#002b16;
color:#00ff88;
font-family:sans-serif;
text-align:center;
}

h1{
margin-top:40px;
}

#wheel{
margin:40px auto;
width:350px;
height:350px;
border-radius:50%;
border:10px solid #00ff88;
background:conic-gradient(
#00ff88 0deg 45deg,
#003b20 45deg 90deg,
#00ff88 90deg 135deg,
#003b20 135deg 180deg,
#00ff88 180deg 225deg,
#003b20 225deg 270deg,
#00ff88 270deg 315deg,
#003b20 315deg 360deg
);
transition:5s cubic-bezier(.17,.67,.12,.99);
position:relative;
}

.num{
position:absolute;
font-size:35px;
font-weight:bold;
color:white;
}

button{
background:#00ff88;
border:0;
padding:18px 50px;
font-size:22px;
border-radius:30px;
cursor:pointer;
}

#result{
font-size:35px;
margin-top:30px;
}
</style>

</head>


<body>

<h1>🟢 心诚则灵 🟢</h1>

<div id="wheel">
</div>


<button onclick="start()">开始转盘</button>

<div id="result"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL=
"https://bnthccgpdtxrehunvtbg.supabase.co";


const SUPABASE_KEY=
"你的sb_publishable";


const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let wheel=document.getElementById("wheel");


let deg=0;


function start(){


let audio=new Audio(
"https://cdn.pixabay.com/audio/2022/03/15/audio_9c2f2c4b3d.mp3"
);

audio.play();


let num=Math.floor(Math.random()*8)+1;


deg+=1800+(num*45);


wheel.style.transform=
`rotate(${deg}deg)`;


setTimeout(async()=>{


document.getElementById("result").innerHTML=
"✨ 心诚则灵："+num+" ✨";


//写入数据库

await client
.from("wheel_results")
.insert({

result:String(num)

});


},5200);



}



</script>


</body>
</html>
