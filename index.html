<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>心诚则灵</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:
radial-gradient(circle,#164d24,#020805);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

font-family:"Microsoft YaHei";

color:white;

overflow:hidden;

}


h1{

font-size:42px;

letter-spacing:12px;

color:#b9ff9c;

text-shadow:
0 0 15px #55ff55,
0 0 30px #22ff22;

margin-bottom:20px;

}



.wheelBox{

position:relative;

}



canvas{

border-radius:50%;

box-shadow:

0 0 30px #65ff65,

0 0 80px #20aa40;

}



.pointer{

position:absolute;

top:-25px;

left:50%;

transform:translateX(-50%);

width:0;

height:0;

border-left:25px solid transparent;

border-right:25px solid transparent;

border-top:60px solid #ffe27a;

filter:
drop-shadow(0 0 10px gold);

z-index:10;

}



button{

margin-top:30px;

width:240px;

height:60px;

border-radius:40px;

border:none;

font-size:26px;

font-weight:bold;

color:white;

background:

linear-gradient(#6cff6c,#159b35);

box-shadow:

0 0 25px #40ff40;


cursor:pointer;

}



button:active{

transform:scale(.95);

}



#result{

margin-top:25px;

font-size:32px;

color:#d8ffbd;

text-shadow:

0 0 15px green;

}

</style>

</head>


<body>


<h1>心诚则灵</h1>


<div class="wheelBox">


<div class="pointer"></div>


<canvas 
id="wheel"
width="500"
height="500">
</canvas>


</div>



<button onclick="spin()">
开始转动
</button>


<div id="result">
本次结果：-
</div>



<script>


const canvas=document.getElementById("wheel");

const ctx=canvas.getContext("2d");



const nums=[
"1","2","3","4",
"5","6","7","8"
];


const colors=[

"#2e7d32",
"#66bb6a",
"#1b5e20",
"#81c784",

"#388e3c",
"#a5d6a7",
"#43a047",
"#c5e1a5"

];



let angle=0;

let spinning=false;



function draw(){


let center=250;

let r=230;

let part=Math.PI*2/8;



ctx.clearRect(0,0,500,500);



for(let i=0;i<8;i++){


ctx.beginPath();

ctx.moveTo(center,center);


ctx.arc(

center,
center,
r,

angle+i*part,

angle+(i+1)*part

);


ctx.fillStyle=colors[i];

ctx.fill();



ctx.strokeStyle="#d6ff9c";

ctx.lineWidth=3;

ctx.stroke();



ctx.save();



ctx.translate(center,center);


ctx.rotate(
angle+i*part+part/2
);



ctx.fillStyle="white";

ctx.font="bold 50px Arial";

ctx.textAlign="center";


ctx.fillText(
nums[i],
150,
15
);



ctx.restore();


}



//中心莲花按钮


ctx.beginPath();

ctx.arc(
250,
250,
65,
0,
Math.PI*2
);


ctx.fillStyle="#e8c85b";

ctx.fill();


ctx.strokeStyle="#fff3a0";

ctx.lineWidth=5;

ctx.stroke();



ctx.fillStyle="#145214";

ctx.font="bold 25px Microsoft YaHei";

ctx.textAlign="center";


ctx.fillText(
"转动",
250,
260
);


}



draw();





function spin(){


if(spinning)return;


spinning=true;


let speed=
Math.random()*0.4+0.5;


let count=0;



let timer=setInterval(()=>{


angle+=speed;


speed*=0.985;


draw();


count++;



if(count>220){


clearInterval(timer);


spinning=false;



let part=Math.PI*2/8;



let index=Math.floor(

(
Math.PI*2-
(angle%(Math.PI*2))
)

/
part

)%8;



document
.getElementById("result")
.innerHTML=

"✨ 本次结果："+nums[index];


}



},20);



}



</script>


</body>
</html>
