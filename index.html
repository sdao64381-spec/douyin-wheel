<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>心诚则灵转盘</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle,#222,#000);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei",Arial,sans-serif;
    overflow:hidden;
}

.wheel-box{
    position:relative;
    width:360px;
    height:360px;
}

canvas{
    width:360px;
    height:360px;
    border-radius:50%;
    box-shadow:
        0 0 20px #fff,
        0 0 60px gold;
}

.pointer{
    position:absolute;
    top:-15px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:60px solid #ffd700;
    filter:drop-shadow(0 0 10px gold);
    z-index:5;
}

button{
    margin-top:50px;
    width:260px;
    height:65px;
    border:none;
    border-radius:40px;
    font-size:32px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#ff0066,#ff9900);
    box-shadow:
        0 0 20px #ff0066,
        0 0 40px orange;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#userInfo{
    margin-top:15px;
    color:#ffd700;
    font-size:16px;
    text-align:center;
}

#result{
    margin-top:12px;
    color:white;
    font-size:25px;
    min-height:35px;
    text-align:center;
}
</style>
</head>

<body>

<div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="360" height="360"></canvas>
</div>

<button id="spinButton" onclick="spin()">心诚则灵</button>

<div id="userInfo"></div>

<div id="result"></div>


<script>

/* =========================
   Supabase 配置
   ========================= */

const SUPABASE_URL =
    "https://bnthccgpdtxrehunvtbg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PcqKnL7U0klVW4LUmSNTrw_HxZ3KCgL";


/* =========================
   自动生成用户编号
   ========================= */

/*
   第一次打开网页：
   自动生成一个用户编号。

   例如：
   用户A7K2M9

   之后再次打开这个网页，
   只要浏览器没有清除网站数据，
   还是同一个编号。
*/

function generateUserId(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i = 0; i < 6; i++){

        result +=
            chars.charAt(
                Math.floor(
                    Math.random() * chars.length
                )
            );

    }

    return "用户" + result;
}


/*
   从浏览器本地保存的记录中读取用户编号
*/

let userId =
    localStorage.getItem("wheel_user_id");


/*
   如果第一次访问，就生成新的编号
*/

if(!userId){

    userId = generateUserId();

    localStorage.setItem(
        "wheel_user_id",
        userId
    );

}


/*
   页面显示用户编号
*/

document.getElementById("userInfo").innerHTML =
    "你的用户编号：" + userId;


/* =========================
   转盘配置
   ========================= */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");


/*
   转盘是 1～8
*/

const numbers = [
    "1",
    "2",
    "3",
    "4",
    "5",
    "6",
    "7",
    "8"
];


const colors = [
    "#ff1744",
    "#ff9100",
    "#ffee00",
    "#00e676",
    "#00b0ff",
    "#651fff",
    "#d500f9",
    "#ff4081"
];


let angle = 0;

let spinning = false;


/* =========================
   画转盘
   ========================= */

function draw(){

    const r = 180;

    const part =
        Math.PI * 2 / numbers.length;


    ctx.clearRect(
        0,
        0,
        360,
        360
    );


    for(
        let i = 0;
        i < numbers.length;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            180,
            180
        );

        ctx.fillStyle =
            colors[i];


        ctx.arc(
            180,
            180,
            r,
            i * part + angle,
            (i + 1) * part + angle
        );


        ctx.fill();


        /* 数字 */

        ctx.save();

        ctx.translate(
            180,
            180
        );

        ctx.rotate(
            i * part +
            part / 2 +
            angle
        );


        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 35px Arial";

        ctx.shadowColor =
            "black";

        ctx.shadowBlur =
            8;

        ctx.textAlign =
            "center";


        ctx.fillText(
            numbers[i],
            120,
            10
        );


        ctx.restore();

    }


    /* =========================
       中心圆
       ========================= */

    ctx.beginPath();

    ctx.arc(
        180,
        180,
        45,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffb300";

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        6;

    ctx.stroke();


    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 18px Microsoft YaHei";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "心诚则灵",
        180,
        186
    );

}


draw();


/* =========================
   写入 Supabase
   ========================= */

async function saveResult(number){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/wheel_results",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Prefer":
                            "return=minimal"
                    },


                    /*
                       同时保存：

                       result = 转出的数字

                       user_name = 用户编号
                    */

                    body:JSON.stringify({

                        result:number,

                        user_name:userId

                    })

                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            console.error(
                "Supabase 写入失败：",
                response.status,
                errorText
            );


            return false;

        }


        console.log(
            "✅ 已成功写入 Supabase",
            {
                用户:userId,
                结果:number
            }
        );


        return true;


    }catch(error){

        console.error(
            "Supabase 请求错误：",
            error
        );


        return false;

    }

}


/* =========================
   开始转盘
   ========================= */

function spin(){

    if(spinning){

        return;

    }


    spinning = true;


    document.getElementById(
        "spinButton"
    ).disabled = true;


    document.getElementById(
        "result"
    ).innerHTML =
        "✨ 转盘进行中...";


    /*
       随机决定最终结果
    */

    const resultIndex =
        Math.floor(
            Math.random() *
            numbers.length
        );


    const resultNumber =
        numbers[resultIndex];


    /*
       每一格的角度
    */

    const part =
        Math.PI * 2 /
        numbers.length;


    /*
       把目标数字转到正上方
    */

    const targetAngle =
        -Math.PI / 2
        -
        (
            resultIndex * part
            +
            part / 2
        );


    const current =
        angle %
        (Math.PI * 2);


    let finalAngle =
        targetAngle;


    /*
       至少旋转 6 圈
    */

    while(
        finalAngle <
        current +
        Math.PI * 2 * 6
    ){

        finalAngle +=
            Math.PI * 2;

    }


    const startAngle =
        angle;


    const distance =
        finalAngle -
        startAngle;


    const duration =
        5000;


    const startTime =
        performance.now();


    function animate(now){

        const elapsed =
            now -
            startTime;


        let progress =
            Math.min(
                elapsed /
                duration,
                1
            );


        /*
           缓出效果
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                4
            );


        angle =
            startAngle +
            distance *
            eased;


        draw();


        if(progress < 1){

            requestAnimationFrame(
                animate
            );


        }else{

            angle =
                finalAngle;


            draw();


            spinning =
                false;


            document.getElementById(
                "spinButton"
            ).disabled = false;


            document.getElementById(
                "result"
            ).innerHTML =
                "🎉 幸运数字：" +
                resultNumber;


            /*
               转盘结束后保存：

               用户编号
               +
               幸运数字
            */

            saveResult(
                resultNumber
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}

</script>

</body>
</html>
