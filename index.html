<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>心诚则灵</title>

<style>
body{
margin:0;
background:#002b16;
color:#00ff88;
font-family:sans-serif;
text-align:center;
}

h1{
margin-top:40px;
font-size:48px;
}

#wheel{
width:420px;
height:420px;
margin:50px auto;
border-radius:50%;
border:8px solid #00ff88;
background:conic-gradient(
#00ff88 0deg 45deg,
#003b20 45deg 90deg,
#00ff88 90deg 135deg,
#003b20 135deg 180deg,
#00ff88 180deg 225deg,
#003b20 225deg 270deg,
#00ff88 270deg 315deg,
#003b20 315deg 360deg
);
position:relative;
transition:5s;
}

.num{
position:absolute;
width:50px;
height:50px;
line-height:50px;
font-size:36px;
font-weight:bold;
color:white;
}

.n1{top:20px;left:185px;}
.n2{top:70px;right:70px;}
.n3{top:185px;right:20px;}
.n4{bottom:70px;right:70px;}
.n5{bottom:20px;left:185px;}
.n6{bottom:70px;left:70px;}
.n7{top:185px;left:20px;}
.n8{top:70px;left:70px;}


button{
font-size:28px;
padding:15px 50px;
border:0;
border-radius:30px;
background:#00ff88;
cursor:pointer;
}

#result{
font-size:35px;
margin-top:30px;
color:white;
}

</style>
</head>


<body>

<h1>🟢 心诚则灵 🟢</h1>


<div id="wheel">

<div class="num n1">1</div>
<div class="num n2">2</div>
<div class="num n3">3</div>
<div class="num n4">4</div>
<div class="num n5">5</div>
<div class="num n6">6</div>
<div class="num n7">7</div>
<div class="num n8">8</div>

</div>


<button onclick="spin()">开始转盘</button>

<div id="result"></div>


<script>

function spin(){

let r=Math.floor(Math.random()*8)+1;

document.getElementById("wheel").style.transform=
"rotate("+(1440+Math.random()*360)+"deg)";


setTimeout(()=>{

document.getElementById("result").innerHTML=
"✨ 心诚结果："+r+" ✨";

},5000);

}

</script>


</body>
</html>
