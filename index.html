<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抖音幸运转盘</title>

<style>

body{
margin:0;
height:100vh;
background:#111;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:"Microsoft Yahei";
color:white;
}

h1{
margin-bottom:20px;
}

canvas{
background:white;
border-radius:50%;
}

button{
margin-top:30px;
padding:15px 40px;
font-size:22px;
border:none;
border-radius:10px;
background:#ff0050;
color:white;
cursor:pointer;
}

#msg{
margin-top:20px;
font-size:20px;
}

</style>

</head>


<body>


<h1>🎁 幸运转盘</h1>


<canvas id="wheel" width="400" height="400"></canvas>


<button onclick="spin()">开始抽奖</button>


<div id="msg"></div>



<script>


// ====== Supabase配置 ======

const SUPABASE_URL =
"https://bnthccgpdtxrehunvtbg.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PcqKnL7U0klVW4LUmSNTrw_HxZ3KCgL";


const headers={
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
};



// ===== 转盘 =====


const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");


const numbers=[
"1等奖",
"2等奖",
"3等奖",
"谢谢参与",
"红包",
"礼品",
"免单",
"积分",
"再来一次"
];


const colors=[
"#ff1744",
"#ff9100",
"#ffee00",
"#00e676",
"#00b0ff",
"#651fff",
"#d500f9",
"#ff4081",
"#795548"
];


let angle=0;
let spinning=false;



function draw(){

let r=200;
let part=Math.PI*2/numbers.length;


ctx.clearRect(0,0,400,400);


for(let i=0;i<numbers.length;i++){

ctx.beginPath();

ctx.moveTo(200,200);

ctx.fillStyle=colors[i];

ctx.arc(
200,
200,
r,
i*part+angle,
(i+1)*part+angle
);

ctx.fill();


ctx.save();

ctx.translate(200,200);

ctx.rotate(
i*part+part/2+angle
);


ctx.fillStyle="white";
ctx.font="20px Arial";
ctx.textAlign="right";

ctx.fillText(
numbers[i],
170,
10
);


ctx.restore();

}


}



draw();





async function saveResult(result){


await fetch(
SUPABASE_URL+"/rest/v1/wheel_results",
{

method:"POST",

headers:headers,

body:JSON.stringify({

name:"游客",

result:result

})

}

);


}






function spin(){


if(spinning)return;


spinning=true;


let speed=Math.random()*0.3+0.3;

let total=0;


let timer=setInterval(()=>{


angle+=speed;

speed*=0.985;

total+=speed;


draw();



if(total>25){


clearInterval(timer);

spinning=false;


//计算最终结果

let index=Math.floor(
(numbers.length -
((angle%(Math.PI*2))/(Math.PI*2)*numbers.length))
)%numbers.length;


let result=numbers[index];



document.getElementById("msg").innerHTML=
"🎉 恭喜："+result;



saveResult(result);



}



},20);



}



</script>


</body>
</html>
